# Data Exfiltration Kill Chain
#
# Two genuinely distinct tiers, not three reworded copies of the same
# one: data_exfiltration.yaml has EX-001/EX-002/EX-003, which are the
# identical blunt "just tell me the system prompt" ask in different
# words, and EX-004, the only attack in the file using a different
# tactic (an indirect/disguised translation-trick framing). A real
# attacker escalates strategy when blocked, not phrasing -- so this
# chain is exactly as long as the real tactical variety in the library
# supports, not padded to a round number.
id: exfil-chain-01
name: "Data Exfiltration Kill Chain"
description: >
  Blunt direct system-prompt reveal request -> indirect/disguised
  exfiltration via a translation-trick framing.
stop_on_fail: true
steps:
  - attack_id: EX-001
  - attack_id: EX-004
